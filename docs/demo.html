<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustrated Energy Flow Card demo</title>
<style>
  :root { --bg: #eef1f4; --card-background-color: #fff; --primary-text-color: #1f262e; --secondary-text-color: #6b7684; --divider-color: #d7dde3; --line: #c9d1d9; }
  body.dark { --bg: #111418; --card-background-color: #1c2025; --primary-text-color: #e6e9ec; --secondary-text-color: #98a2ad; --divider-color: #343b43; --line: #3a424b; }
  body { margin: 0; background: var(--bg); color: var(--primary-text-color); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: var(--secondary-text-color); margin: 0 0 14px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .cardbox { width: 600px; max-width: 100%; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); }
  ha-card .hdr { font-size: 22px; padding: 16px 16px 0; }
  .ctrl { width: 330px; background: var(--card-background-color); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .ctrl h2 { font-size: 16px; margin: 0 0 4px; font-weight: 500; }
  .ctrl label { display: block; font-size: 13px; margin: 9px 0 2px; }
  .ctrl input[type=range] { width: 100%; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .seg button { border: 1px solid var(--line); background: var(--card-background-color); color: var(--primary-text-color); border-radius: 8px; padding: 5px 9px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button.on { background: #2f7de1; color: #fff; border-color: #2f7de1; }
  body.only .page > h1, body.only .lead, body.only .ctrl { display: none; }
  body.only { background: transparent; }
  body.only .page { padding: 8px; }
</style>
</head>
<body>
<div class="page">
  <h1>Illustrated Energy Flow Card</h1>
  <p class="lead">Live demo of the built card with simulated sensors.</p>
  <div class="row">
    <div class="cardbox" id="box"></div>
    <div class="ctrl">
      <h2>Simulator</h2>
      <label>Sun: <b id="sunv"></b></label><input type="range" id="sun" min="0" max="100" value="80">
      <label>Shade on panel 4 of string 1: <b id="shv"></b></label><input type="range" id="shade" min="0" max="100" value="70">
      <label>Home base load: <b id="hv"></b></label><input type="range" id="house" min="150" max="2500" step="10" value="520">
      <label>Battery</label>
      <div class="seg" data-k="bat"><button data-v="auto" class="on">Auto</button><button data-v="idle">Idle</button><button data-v="discharge">Discharge</button><button data-v="none">None</button></div>
      <label>Consumers</label>
      <div class="seg" data-k="cons" data-multi><button data-v="ev" class="on">EV</button><button data-v="hp" class="on">Heat pump</button><button data-v="wh">Water heater</button><button data-v="pl">Plug</button></div>
      <label>Solar view</label>
      <div class="seg" data-k="view"><button data-v="panel" class="on">Panel</button><button data-v="string">String</button><button data-v="total">Total</button></div>
      <label>Meter</label>
      <div class="seg" data-k="meter"><button data-v="box" class="on">Digital</button><button data-v="linky">Linky</button><button data-v="dome">Dome</button></div>
      <label>Style</label>
      <div class="seg" data-k="flow"><button data-v="arrows" class="on">Arrows</button><button data-v="dashes">Dashes</button></div>
      <div class="seg" data-k="lang"><button data-v="en" class="on">EN</button><button data-v="fr">FR</button><button data-v="de">DE</button><button data-v="es">ES</button><button data-v="it">IT</button><button data-v="nl">NL</button></div>
      <div class="seg" data-k="theme"><button data-v="light" class="on">Light</button><button data-v="dark">Dark</button></div>
    </div>
  </div>
</div>
<script>
// A stand-in for Home Assistant's ha-card, showing its header.
customElements.define("ha-card", class extends HTMLElement {
  static get observedAttributes() { return ["header"]; }
  attributeChangedCallback() { this._hdr(); }
  connectedCallback() { this._hdr(); }
  _hdr() {
    let h = this.querySelector(":scope > .hdr");
    const v = this.getAttribute("header");
    if (v && !h) { h = document.createElement("div"); h.className = "hdr"; this.prepend(h); }
    if (h) { if (v) h.textContent = v; else h.remove(); }
  }
});
</script>
<script src="../dist/illustrated-energy-flow-card.js"></script>
<script>
const q = new URLSearchParams(location.search);
const st = { sun: 80, shade: 70, house: 520, bat: "auto", cons: new Set(["ev", "hp"]), view: "panel", meter: "box", flow: "arrows", lang: "en", theme: "light" };
for (const k of ["bat", "view", "meter", "flow", "lang", "theme"]) if (q.get(k)) st[k] = q.get(k);
if (q.get("cons")) st.cons = new Set(q.get("cons").split(",").filter(Boolean));
if (q.get("only") === "card") document.body.classList.add("only");
const STR = [{ name: "South", n: 6, eff: 1 }, { name: "West", n: 4, eff: 0.72 }];
const NAMES = { fr: ["Sud", "Ouest"], de: ["Süd", "West"], es: ["Sur", "Oeste"], it: ["Sud", "Ovest"], nl: ["Zuid", "West"] };

function hass() {
  const s = {};
  const put = (id, v, unit = "W") => (s[id] = { entity_id: id, state: String(Math.round(v * 10) / 10), attributes: { unit_of_measurement: unit } });
  const sun = st.sun / 100;
  let pv = 0;
  STR.forEach((g, gi) => {
    for (let i = 0; i < g.n; i++) {
      const shade = gi === 0 && i === 3 ? st.shade / 100 : 0;
      const w = 425 * 0.86 * sun * g.eff * (1 - 0.03 * ((i * 7 + gi * 3) % 4)) * (1 - 0.85 * shade);
      put(`sensor.panel_${gi + 1}_${i + 1}_power`, w); pv += w;
    }
  });
  const cons = { ev: 3680, hp: 940, wh: 1800, pl: 85 };
  let load = st.house;
  for (const k of Object.keys(cons)) { put(`sensor.${k}_power`, st.cons.has(k) ? cons[k] : 0); if (st.cons.has(k)) load += cons[k]; }
  let bat = 0;
  if (st.bat === "auto") bat = pv - load > 0 ? -Math.min(pv - load, 3000) : Math.min(load - pv, 2500);
  if (st.bat === "discharge") bat = 2500;
  put("sensor.battery_power", bat); put("sensor.battery_level", 64, "%");
  put("sensor.grid_power", load - pv - (st.bat === "none" ? 0 : bat));
  return { states: s, language: st.lang, locale: { language: st.lang } };
}

function config() {
  const names = NAMES[st.lang] || ["South", "West"];
  const c = {
    type: "custom:illustrated-energy-flow-card",
    title: { en: "Energy", fr: "Énergie", de: "Energie", es: "Energía", it: "Energia", nl: "Energie" }[st.lang],
    flow_style: st.flow,
    grid: { power_entity: "sensor.grid_power", meter: st.meter },
    solar: { view: st.view, strings: STR.map((g, gi) => ({ name: names[gi], panels: Array.from({ length: g.n }, (_, i) => `sensor.panel_${gi + 1}_${i + 1}_power`) })) },
    consumers: [],
  };
  if (st.bat !== "none") c.battery = { power_entity: "sensor.battery_power", soc_entity: "sensor.battery_level", reserve: 10 };
  for (const [k, type] of [["ev", "ev_charger"], ["hp", "heat_pump"], ["wh", "water_heater"], ["pl", "generic"]]) if (st.cons.has(k)) c.consumers.push({ entity: `sensor.${k}_power`, type });
  return c;
}

const card = document.createElement("illustrated-energy-flow-card");
document.getElementById("box").appendChild(card);
// Home Assistant styles ha-card itself; here the card's shadow root gets a stand-in.
function dress() {
  if (!card.shadowRoot || card.shadowRoot.querySelector("style.demo")) return;
  const s = document.createElement("style");
  s.className = "demo";
  s.textContent = "ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04)} ha-card .hdr{font-size:22px;padding:16px 16px 0;color:var(--primary-text-color)}";
  card.shadowRoot.appendChild(s);
}
function render() {
  document.body.classList.toggle("dark", st.theme === "dark");
  card.setConfig(config());
  card.hass = hass();
  dress();
  document.getElementById("sunv").textContent = `${st.sun} %`;
  document.getElementById("shv").textContent = `${st.shade} %`;
  document.getElementById("hv").textContent = `${st.house} W`;
}
for (const id of ["sun", "shade", "house"]) document.getElementById(id).addEventListener("input", (e) => { st[id] = +e.target.value; render(); });
document.querySelectorAll(".seg").forEach((g) => {
  const k = g.dataset.k;
  g.querySelectorAll("button").forEach((b) => b.classList.toggle("on", g.hasAttribute("data-multi") ? st[k].has(b.dataset.v) : st[k] === b.dataset.v));
  g.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const v = b.dataset.v;
    if (g.hasAttribute("data-multi")) { st[k].has(v) ? st[k].delete(v) : st[k].add(v); b.classList.toggle("on"); }
    else { st[k] = v; g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); }
    render();
  });
});
render();
</script>
</body>
</html>
